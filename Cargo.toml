[package]
name = "tizen-ornn"
version = "2.2.0"
license = "Apache-2.0"
edition = "2024"
default-run = "tizen-ornn"

[features]
desktop = ["dep:eframe","dep:wgpu","dep:egui-file-dialog"]

[dependencies]
url = "2"
roxmltree = "0.20"
egui-file-dialog = { version = "0.10", optional = true, default-features = false }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[bin]]
name = "tizen-ornn-gui"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "24", optional = true, default-features = false, features = ["dx12"] }
fatfs = { version = "0.3", default-features = false, features = ["std","alloc"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros", "process"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation"] }
