[package]
name = "tizen-ornn"
version = "10.1.17"
edition = "2024"
default-run = "tizen-ornn"

[features]
desktop = ["dep:eframe","dep:wgpu"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[[bin]]
name = "tizen-ornn-gui"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[target.'cfg(windows)'.dependencies]
tempfile = "3"
sha2 = "0.10"
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "24", optional = true, default-features = false, features = ["dx12"] }
fatfs = { version = "0.3", default-features = false, features = ["std","alloc"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }
