name: Native host tools
on:
  workflow_dispatch:
    inputs:
      provision:
        description: Build a fresh Tizen disk from the official snapshot on Windows
        type: boolean
        default: false
  push:
    paths: ['Cargo.*', 'build.rs', 'packaging/ornn.rc', 'packaging/art/tizen-ornn.ico', 'src/**', 'guest/tizen-ornn-share', 'packaging/windows-launcher.nsi', 'config/version', 'tests/windows-console.ps1', '.github/workflows/native.yml']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build a disposable serial test filesystem
        shell: bash
        run: |
          set -eu
          mkdir -p fixture root/{bin,dev,proc,sys,usr/lib/systemd}
          apt-get download busybox-static
          dpkg-deb -x ./busybox-static*.deb busybox
          cp "$(find busybox -type f -name busybox -print -quit)" root/bin/busybox
          mkdir -p root/{run,opt/usr/home/tizen/share}
          ln -s opt/usr/home root/home
          for applet in sh mount readlink mktemp find mv mkdir rmdir sync cat tr grep; do
            ln -s busybox "root/bin/$applet"
          done
          printf '#!/bin/sh\nexit 0\n' > root/bin/chsmack
          chmod +x root/bin/chsmack
          echo preserved >root/opt/usr/home/tizen/share/.original
          cat > root/usr/lib/systemd/systemd <<'INIT'
          #!/bin/busybox sh
          export PATH=/bin
          [ "$(cat /home/tizen/share.before-host/.original)" = preserved ] || /bin/busybox poweroff -f
          echo guest-write > /home/tizen/share/fixture-check || /bin/busybox poweroff -f
          echo ORNN_SERIAL_READY
          read -r input
          case "$input" in ornn-console-check*) echo ORNN_SERIAL_OK ;; esac
          /bin/busybox poweroff -f
          INIT
          chmod +x root/usr/lib/systemd/systemd
          truncate -s 32M fixture/tizen-rootfs.ext4
          mkfs.ext4 -q -d root fixture/tizen-rootfs.ext4
          curl -fsSL https://github.com/hjhun/tizen-ornn/releases/download/10.1-r15/bzImage -o fixture/bzImage
          (cd fixture && grep ' bzImage$' ../kernel/r6.sha256 | sha256sum -c -)
      - uses: actions/upload-artifact@v4
        with:
          name: serial-fixture
          path: fixture
          retention-days: 1
      - name: Package the matching recipe for a full Windows build
        run: |
          mkdir -p kernel-input builder
          cp fixture/bzImage kernel-input/
          curl -fsSL https://github.com/hjhun/tizen-ornn/releases/download/10.1-r15/kernel.config -o kernel-input/kernel.config
          cp kernel/r6.sha256 kernel-input/kernel.sha256
          TIZEN_ORNN_KERNEL_DIR="$PWD/kernel-input" scripts/package-cli.sh builder
          cp fixture/bzImage builder/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builder-inputs
          path: builder
          retention-days: 1
  windows:
    runs-on: windows-2022
    needs: fixture
    timeout-minutes: ${{ (inputs.provision || github.ref_name == 'verify/native-host-r16') && 300 || 25 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: serial-fixture
          path: test image
      - run: cargo build --locked --release --features desktop
      - name: Exercise native CLI, window creation and guest serial I/O
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = (Resolve-Path target/release/tizen-ornn.exe).Path
          & $cli --version
          if ($LASTEXITCODE) { throw 'CLI failed' }
          & $cli images
          if ($LASTEXITCODE) { throw 'Image discovery failed' }
          $gui = Start-Process target/release/tizen-ornn-gui.exe -PassThru
          try {
            for ($i=0; $i -lt 60; $i++) {
              $gui.Refresh()
              if ($gui.MainWindowTitle -eq 'Tizen Ornn') { break }
              if ($gui.HasExited) { throw "GUI exited: $($gui.ExitCode)" }
              Start-Sleep 1
            }
            if ($gui.MainWindowTitle -ne 'Tizen Ornn') { throw 'GUI window missing' }
          } finally { if (!$gui.HasExited) { $gui.Kill() } }
          $setup = "$env:RUNNER_TEMP/qemu.exe"
          curl.exe -fLsS --retry 2 https://github.com/arixmkii/qcw/releases/download/v0.1.28/ucrt64-qemu-setup-11.1.3.exe -o $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne 'cd1a2963b5ef8e3e280c3726c51d153227b75c17ded116af87292ad975d1a352') { throw 'QEMU checksum mismatch' }
          $env:TIZEN_ORNN_QEMU_DIR = "$env:RUNNER_TEMP/qemu"
          7z x -y $setup "-o$env:TIZEN_ORNN_QEMU_DIR" | Out-Null
          if ($LASTEXITCODE) { throw 'QEMU extraction failed' }
          ./tests/windows-console.ps1 -Cli $cli -Image (Resolve-Path 'test image')
      - uses: actions/download-artifact@v4
        with:
          name: windows-builder-inputs
          path: target/release/builder
      - name: Package and open the standalone executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          if (!(Test-Path $makensis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE) { throw 'Could not install NSIS' }
          }
          $payload = (Resolve-Path target/release).Path
          $bundle = "$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $makensis "/DPAYLOAD=$payload" "/DBUNDLE_ID=$bundle" packaging/windows-launcher.nsi
          if ($LASTEXITCODE) { throw 'Failed to package standalone executable' }
          $downloads = New-Item -ItemType Directory "$env:RUNNER_TEMP/Ornn standalone download"
          Copy-Item "$payload/tizen-ornn-windows-x64.exe" $downloads
          $installed = "$env:LOCALAPPDATA/Tizen Ornn/tools/$bundle"
          if (Test-Path $installed) { throw 'Expected a fresh bundle directory' }
          foreach ($attempt in 1..2) {
            $launch = Start-Process "$downloads/tizen-ornn-windows-x64.exe" -WorkingDirectory $downloads -PassThru
            if (!$launch.WaitForExit(90000)) { throw 'Standalone launcher timed out' }
            if ($launch.ExitCode -ne 0) { throw "Standalone launcher exited with $($launch.ExitCode)" }
            $gui = $null
            try {
              for ($i = 0; $i -lt 60; $i++) {
                $gui = Get-Process -Name tizen-ornn-gui -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$installed/tizen-ornn-gui.exe".Replace('/','\') }
                if ($gui.MainWindowTitle -eq 'Tizen Ornn') { break }
                Start-Sleep 1
              }
              if ($gui.MainWindowTitle -ne 'Tizen Ornn') { throw 'Standalone GUI window missing' }
            } finally { if ($gui) { $gui.Kill(); $gui.WaitForExit() } }
          }
          foreach ($file in 'tizen-ornn.exe','tizen-ornn-gui.exe','builder/bzImage','builder/tizen-ornn_amd64.deb') {
            if ((Get-FileHash "$installed/$file").Hash -ne (Get-FileHash "$payload/$file").Hash) { throw "Damaged $file" }
          }
          & "$installed/tizen-ornn.exe" --version
          if ($LASTEXITCODE) { throw 'Bundled CLI failed' }
      - name: Build a new Windows guest and verify the independent disk
        if: inputs.provision || github.ref_name == 'verify/native-host-r16'
        shell: pwsh
        run: |
          $env:TIZEN_ORNN_QEMU_DIR = "$env:RUNNER_TEMP/qemu"
          $env:TIZEN_ORNN_HOME = "$env:RUNNER_TEMP/Ornn images"
          ./target/release/tizen-ornn.exe build --name first-boot
          if ($LASTEXITCODE) { throw 'Guest build failed' }
          $images = ./target/release/tizen-ornn.exe images | ConvertFrom-Json
          if ($images.Count -ne 1) { throw 'Image discovery failed after build' }
          & "$env:TIZEN_ORNN_QEMU_DIR/qemu-img.exe" check "$($images[0].path)/tizen-rootfs.qcow2"
          if ($LASTEXITCODE) { throw 'New disk is inconsistent' }
          ./tests/windows-console.ps1 -Development -Cli (Resolve-Path target/release/tizen-ornn.exe) -Image $images[0].path
      - uses: actions/upload-artifact@v4
        with:
          name: windows-host-tools
          path: target/release/tizen-ornn*.exe
          retention-days: 3
